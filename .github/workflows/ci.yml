name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default (security audit: a job with write permissions that
# installs unpinned packages is a critical supply-chain finding). Raise per job
# only when a job genuinely needs it.
permissions:
  contents: read

# A second push supersedes the first: no stale run racing the new one to report.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned by commit SHA, not moving major tags — the tag can be re-pointed,
# the SHA cannot. The trailing comment carries the human-readable version.
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Read from [tool.uv] required-version — never restated here. That is a
          # floor, so the action resolves the highest uv satisfying it; without a
          # version-file it would install whatever is latest regardless.
          version-file: pyproject.toml
          enable-cache: true
      # --locked: fail if uv.lock disagrees with pyproject instead of re-resolving.
      - run: uv sync --locked --all-extras
      - name: Lint + format
        run: make lint format
      # mypy and pytest both exit non-zero on an empty tree, so each waits for
      # its code to exist. Specific globs, not `**/*.py`: the .venv just created
      # by uv sync would match that and make the guard always true.
      - name: Types
        if: hashFiles('app/**/*.py') != ''
        run: make typecheck
      - name: Tests
        if: hashFiles('tests/**/*.py') != ''
        run: make test

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # hashFiles is unavailable in a job-level `if`, so the guard sits on each step.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts: no lifecycle scripts from third-party packages run in CI.
      - name: Install, lint, build
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run lint --if-present
          npm run build --if-present

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
      # Reads uv.lock and queries OSV; non-zero exit on any finding.
      - run: uv audit --preview-features audit-command
      - name: npm audit
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm audit
